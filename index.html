<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️ Поймай звезду</title>
    
    <!-- Для Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            font-family: -apple-system, 'SF Pro', 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            position: relative;
        }
        
        #gameArea {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        /* Верхняя панель */
        #topBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #levelInfo {
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        #comboInfo {
            color: #ffd700;
            font-size: 12px;
        }
        
        #scoreInfo {
            color: #ffd700;
            font-weight: bold;
            font-size: 22px;
        }
        
        .top-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .top-button:active {
            transform: scale(0.8);
        }
        
        /* Таймер */
        #timerContainer {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }
        
        #timerCircle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #timerText {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        /* Звезда */
        .star {
            position: absolute;
            font-size: 60px;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 5;
            filter: drop-shadow(0 0 15px rgba(255,215,0,0.8));
            animation: starPulse 0.5s ease-in-out;
        }
        
        .star:active {
            transform: scale(1.2);
        }
        
        .bad-star {
            filter: drop-shadow(0 0 15px rgba(255,0,0,0.8));
        }
        
        /* Бонусы */
        .bonus {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            z-index: 5;
            animation: bonusAppear 0.3s ease-out;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
        }
        
        /* Частицы */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 3;
            animation: particleFly 0.8s ease-out forwards;
        }
        
        /* Комбо текст */
        #comboText {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: comboPop 0.5s ease-out;
            pointer-events: none;
            white-space: nowrap;
        }
        
        /* Оверлеи */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        .overlay-card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        .overlay-title {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .overlay-text {
            color: #ddd;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .game-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(76,175,80,0.4);
            width: 100%;
            max-width: 280px;
        }
        
        .game-button:active {
            transform: scale(0.9);
        }
        
        .game-button.orange {
            background: #FF9800;
            box-shadow: 0 4px 15px rgba(255,152,0,0.4);
        }
        
        .game-button.purple {
            background: #9C27B0;
            box-shadow: 0 4px 15px rgba(156,39,176,0.4);
        }
        
        /* Рекламный баннер */
        #adBanner {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0,0,0,0.6);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .ad-button {
            background: #FF9800;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* Анимации */
        @keyframes starPulse {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        @keyframes bonusAppear {
            0% { transform: scale(0) rotate(0deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        
        @keyframes particleFly {
            0% { 
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% { 
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }
        
        @keyframes comboPop {
            0% { transform: translateX(-50%) scale(0); }
            50% { transform: translateX(-50%) scale(1.3); }
            100% { transform: translateX(-50%) scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-10deg); }
            75% { transform: translateX(10px) rotate(10deg); }
        }
        
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameArea">
        <!-- Верхняя панель -->
        <div id="topBar">
            <div>
                <div id="levelInfo">Уровень: 1</div>
                <div id="comboInfo"></div>
            </div>
            
            <div style="display: flex; gap: 8px;">
                <button class="top-button" onclick="togglePause()" id="pauseBtn">⏸</button>
                <button class="top-button" onclick="toggleSound()" id="soundBtn">🔊</button>
                <button class="top-button" onclick="showLeaderboard()">🏆</button>
                <button class="top-button" onclick="shareGame()">📤</button>
            </div>
            
            <div id="scoreInfo">⭐️ 0</div>
        </div>
        
        <!-- Таймер -->
        <div id="timerContainer">
            <div id="timerCircle">
                <span id="timerText">10</span>
            </div>
        </div>
        
        <!-- Комбо текст -->
        <div id="comboText" class="hidden"></div>
        
        <!-- Рекламный баннер -->
        <div id="adBanner" class="hidden">
            <span style="font-size: 14px; color: white;">📢 Реклама</span>
            <button class="ad-button" onclick="clickAd()">Подробнее</button>
            <button class="ad-button" onclick="removeAds()" style="background: #9C27B0;">Premium 99₽</button>
        </div>
        
        <!-- Экран паузы -->
        <div id="pauseOverlay" class="overlay hidden">
            <div class="overlay-card">
                <h2 class="overlay-title">⏸ Пауза</h2>
                <button class="game-button" onclick="togglePause()">▶️ Продолжить</button>
            </div>
        </div>
        
        <!-- Экран окончания игры -->
        <div id="gameOverOverlay" class="overlay hidden">
            <div class="overlay-card">
                <h2 class="overlay-title">🎮 Игра окончена!</h2>
                <p class="overlay-text" id="finalScore">Счёт: 0</p>
                <p class="overlay-text" id="finalLevel">Уровень: 1</p>
                <p class="overlay-text" id="bestScore" style="color: #ffd700;">Лучший: 0</p>
                
                <button class="game-button" onclick="startGame()">🔄 Играть снова</button>
                <button class="game-button orange" onclick="showLeaderboard()">🏆 Рекорды</button>
                <button class="game-button purple" onclick="watchAdForBonus()">🎁 +10 очков за рекламу</button>
            </div>
        </div>
        
        <!-- Таблица рекордов -->
        <div id="leaderboardOverlay" class="overlay hidden">
            <div class="overlay-card">
                <h2 class="overlay-title">🏆 Рекорды</h2>
                <div id="leaderboardList" style="color: white; margin: 15px 0; max-height: 300px; overflow-y: auto;">
                    Загрузка...
                </div>
                <button class="game-button" onclick="hideLeaderboard()">Закрыть</button>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== ИГРОВЫЕ ПЕРЕМЕННЫЕ ====================
        let score = 0;
        let level = 1;
        let timeLeft = 10;
        let combo = 0;
        let isPaused = false;
        let gameOver = false;
        let isBadStar = false;
        let soundOn = true;
        let gamesPlayed = 0;
        
        let gameTimer = null;
        let starTimer = null;
        
        // Рекламная статистика
        let adStats = {
            impressions: parseInt(localStorage.getItem('adImpressions') || '0'),
            clicks: parseInt(localStorage.getItem('adClicks') || '0'),
            revenue: parseFloat(localStorage.getItem('adRevenue') || '0'),
            isAdFree: localStorage.getItem('isAdFree') === 'true'
        };
        
        // ==================== ЗВУКИ ====================
        let audioContext = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            if (!soundOn) return;
            
            try {
                initAudio();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'correct':
                        oscillator.frequency.value = 800;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.3;
                        oscillator.start();
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                        oscillator.stop(audioContext.currentTime + 0.2);
                        break;
                    case 'wrong':
                        oscillator.frequency.value = 200;
                        oscillator.type = 'sawtooth';
                        gainNode.gain.value = 0.3;
                        oscillator.start();
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                    case 'levelup':
                        oscillator.frequency.value = 600;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.3;
                        oscillator.start();
                        setTimeout(() => { oscillator.frequency.value = 900; }, 100);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                        oscillator.stop(audioContext.currentTime + 0.4);
                        break;
                    case 'bonus':
                        oscillator.frequency.value = 1000;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.3;
                        oscillator.start();
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                        oscillator.stop(audioContext.currentTime + 0.15);
                        break;
                    case 'gameover':
                        oscillator.frequency.value = 400;
                        oscillator.type = 'sawtooth';
                        gainNode.gain.value = 0.3;
                        oscillator.start();
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                        oscillator.stop(audioContext.currentTime + 0.5);
                        break;
                }
            } catch(e) {
                console.log('Звук недоступен');
            }
        }
        
        // ==================== УПРАВЛЕНИЕ ====================
        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
            if (soundOn) playSound('correct');
        }
        
        function togglePause() {
            if (gameOver) return;
            
            isPaused = !isPaused;
            document.getElementById('pauseOverlay').classList.toggle('hidden', !isPaused);
            
            if (isPaused) {
                clearInterval(gameTimer);
                clearInterval(starTimer);
                document.getElementById('pauseBtn').textContent = '▶️';
            } else {
                document.getElementById('pauseBtn').textContent = '⏸';
                startTimers();
            }
        }
        
        // ==================== НАЧАЛО ИГРЫ ====================
        function startGame() {
            score = 0;
            level = 1;
            timeLeft = 10;
            combo = 0;
            isPaused = false;
            gameOver = false;
            gamesPlayed++;
            
            document.getElementById('gameOverOverlay').classList.add('hidden');
            document.getElementById('pauseOverlay').classList.add('hidden');
            
            updateUI();
            
            // Реклама каждые 3 игры
            if (gamesPlayed >= 3 && !adStats.isAdFree) {
                gamesPlayed = 0;
                showInterstitialAd();
            }
            
            if (!adStats.isAdFree) {
                showBannerAd();
            }
            
            createStar();
            startTimers();
            playSound('levelup');
        }
        
        function startTimers() {
            clearInterval(gameTimer);
            clearInterval(starTimer);
            
            gameTimer = setInterval(() => {
                if (!isPaused && !gameOver) {
                    timeLeft--;
                    updateTimer();
                    
                    if (timeLeft <= 0) {
                        endLevel();
                    }
                }
            }, 1000);
            
            moveStarTimer();
        }
        
        function moveStarTimer() {
            clearInterval(starTimer);
            
            const interval = Math.max(400, 1500 - level * 100);
            
            starTimer = setInterval(() => {
                if (!isPaused && !gameOver) {
                    moveStar();
                }
            }, interval);
        }
        
        // ==================== СОЗДАНИЕ ЗВЕЗДЫ ====================
        function createStar() {
            const gameArea = document.getElementById('gameArea');
            const oldStar = document.querySelector('.star');
            if (oldStar) oldStar.remove();
            
            const star = document.createElement('div');
            star.className = 'star';
            star.id = 'star';
            
            isBadStar = level >= 3 && Math.random() * 100 <= level * 5;
            star.textContent = isBadStar ? '❌' : '⭐️';
            
            if (isBadStar) star.classList.add('bad-star');
            
            const size = Math.max(30, 70 - level * 3);
            star.style.fontSize = size + 'px';
            
            positionElement(star);
            
            star.addEventListener('click', handleStarClick);
            star.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleStarClick();
            });
            
            gameArea.appendChild(star);
        }
        
        function moveStar() {
            const star = document.getElementById('star');
            if (!star || gameOver) return;
            
            isBadStar = level >= 3 && Math.random() * 100 <= level * 5;
            star.textContent = isBadStar ? '❌' : '⭐️';
            
            if (isBadStar) {
                star.classList.add('bad-star');
            } else {
                star.classList.remove('bad-star');
            }
            
            star.style.transition = 'all 0.3s ease-in-out';
            positionElement(star);
            
            star.style.transform = 'scale(0.8)';
            setTimeout(() => {
                star.style.transform = 'scale(1)';
            }, 150);
            
            moveStarTimer();
        }
        
        function positionElement(element) {
            const gameArea = document.getElementById('gameArea');
            const areaWidth = gameArea.clientWidth;
            const areaHeight = gameArea.clientHeight;
            
            const x = Math.random() * (areaWidth - 100) + 50;
            const y = Math.random() * (areaHeight - 300) + 150;
            
            element.style.left = x + 'px';
            element.style.top = y + 'px';
        }
        
        // ==================== ОБРАБОТКА НАЖАТИЯ ====================
        function handleStarClick() {
            if (isPaused || gameOver) return;
            
            const star = document.getElementById('star');
            
            if (isBadStar) {
                score = Math.max(0, score - 1);
                combo = 0;
                showComboText('Промах! 💥');
                playSound('wrong');
                createParticles(star, 'red', 10);
                
                star.classList.add('shake');
                setTimeout(() => star.classList.remove('shake'), 300);
            } else {
                combo++;
                const bonus = combo > 5 ? 3 : combo > 3 ? 2 : 1;
                score += bonus;
                
                if (combo > 5) showComboText('СУПЕР! 🔥 x' + bonus);
                else if (combo > 3) showComboText('Круто! ⭐️ x' + bonus);
                else showComboText('Отлично! ⭐️');
                
                playSound('correct');
                createParticles(star, 'yellow', 15);
                
                if (Math.random() * 100 <= 15) spawnBonus();
            }
            
            updateUI();
            moveStar();
        }
        
        // ==================== БОНУСЫ ====================
        function spawnBonus() {
            const gameArea = document.getElementById('gameArea');
            const oldBonus = document.querySelector('.bonus');
            if (oldBonus) oldBonus.remove();
            
            const bonus = document.createElement('div');
            bonus.className = 'bonus';
            
            const types = [
                { emoji: '❤️', effect: () => { score += 3; showComboText('Бонус! ❤️ +3'); } },
                { emoji: '⏰', effect: () => { timeLeft += 5; updateTimer(); showComboText('Время! ⏰ +5с'); } },
                { emoji: '🌟', effect: () => { score += 5; showComboText('Суперзвезда! 🌟 +5'); } }
            ];
            
            const type = types[Math.floor(Math.random() * types.length)];
            bonus.textContent = type.emoji;
            
            positionElement(bonus);
            
            const collectBonus = () => {
                type.effect();
                playSound('bonus');
                createParticles(bonus, 'yellow', 20);
                bonus.remove();
                updateUI();
            };
            
            bonus.addEventListener('click', collectBonus);
            bonus.addEventListener('touchstart', (e) => {
                e.preventDefault();
                collectBonus();
            });
            
            gameArea.appendChild(bonus);
            
            setTimeout(() => bonus.remove(), 3000);
        }
        
        // ==================== ЧАСТИЦЫ ====================
        function createParticles(element, color, count) {
            const gameArea = document.getElementById('gameArea');
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = color === 'yellow' ? '✨' : '💥';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.fontSize = Math.random() * 20 + 10 + 'px';
                
                const dx = Math.random() * 200 - 100;
                const dy = Math.random() * 200 - 100;
                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                
                gameArea.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }
        
        // ==================== КОМБО ТЕКСТ ====================
        function showComboText(text) {
            const comboElement = document.getElementById('comboText');
            comboElement.textContent = text;
            comboElement.classList.remove('hidden');
            comboElement.style.animation = 'none';
            comboElement.offsetHeight;
            comboElement.style.animation = '';
            
            clearTimeout(window.comboTimeout);
            window.comboTimeout = setTimeout(() => {
                comboElement.classList.add('hidden');
            }, 1000);
        }
        
        // ==================== ОБНОВЛЕНИЕ UI ====================
        function updateUI() {
            document.getElementById('levelInfo').textContent = 'Уровень: ' + level;
            document.getElementById('scoreInfo').textContent = '⭐️ ' + score;
            document.getElementById('comboInfo').textContent = combo > 1 ? 'Комбо: x' + combo : '';
        }
        
        function updateTimer() {
            const timerText = document.getElementById('timerText');
            timerText.textContent = timeLeft;
            timerText.style.color = timeLeft < 3 ? '#ff4444' : 'white';
        }
        
        // ==================== КОНЕЦ УРОВНЯ ====================
        function endLevel() {
            if (score >= level * 3) {
                level++;
                timeLeft = 10;
                score = 0;
                combo = 0;
                
                updateUI();
                updateTimer();
                playSound('levelup');
                showComboText('Уровень ' + level + '! 🎉');
                
                startTimers();
            } else {
                endGame();
            }
        }
        
        function endGame() {
            gameOver = true;
            clearInterval(gameTimer);
            clearInterval(starTimer);
            
            const star = document.getElementById('star');
            if (star) star.remove();
            
            updateLeaderboard(score);
            
            document.getElementById('finalScore').textContent = 'Счёт: ' + score;
            document.getElementById('finalLevel').textContent = 'Уровень: ' + level;
            document.getElementById('bestScore').textContent = 'Лучший: ' + getBestScore();
            document.getElementById('gameOverOverlay').classList.remove('hidden');
            
            playSound('gameover');
        }
        
        // ==================== РЕКОРДЫ ====================
        function updateLeaderboard(newScore) {
            let scores = JSON.parse(localStorage.getItem('highScores') || '[]');
            scores.push({ score: newScore, level: level, date: new Date().toLocaleDateString() });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 10);
            localStorage.setItem('highScores', JSON.stringify(scores));
        }
        
        function getBestScore() {
            const scores = JSON.parse(localStorage.getItem('highScores') || '[]');
            return scores.length > 0 ? scores[0].score : 0;
        }
        
        function showLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('highScores') || '[]');
            const listElement = document.getElementById('leaderboardList');
            
            if (scores.length === 0) {
                listElement.innerHTML = '<p style="color: #999;">Пока нет рекордов</p>';
            } else {
                listElement.innerHTML = scores.map((s, i) => 
                    '<div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">' +
                    '<span style="color: ' + (i < 3 ? '#ffd700' : 'white') + ';">' + (i + 1) + '. ' + s.score + ' очков</span>' +
                    '<span style="color: #999; font-size: 14px;">Ур. ' + s.level + '</span>' +
                    '</div>'
                ).join('');
            }
            
            document.getElementById('leaderboardOverlay').classList.remove('hidden');
        }
        
        function hideLeaderboard() {
            document.getElementById('leaderboardOverlay').classList.add('hidden');
        }
        
        // ==================== SHARING ====================
        function shareGame() {
            const text = '🎮 Играю в "Поймай звезду"! Попробуй и ты!';
            const url = window.location.href;
            
            if (navigator.share) {
                navigator.share({ title: 'Поймай звезду', text: text, url: url });
            } else {
                alert(text + ' ' + url);
            }
        }
        
        // ==================== РЕКЛАМА ====================
        function showBannerAd() {
            const banner = document.getElementById('adBanner');
            banner.classList.remove('hidden');
            adStats.impressions++;
            saveAdStats();
        }
        
        function showInterstitialAd() {
            adStats.impressions++;
            saveAdStats();
            console.log('Показ межстраничной рекламы');
        }
        
        function clickAd() {
            adStats.clicks++;
            adStats.revenue += 0.30;
            saveAdStats();
            alert('Спасибо за интерес! Это демонстрация рекламы.');
        }
        
        function watchAdForBonus() {
            adStats.impressions++;
            adStats.revenue += 0.05;
            saveAdStats();
            
            alert('🎁 +10 очков за просмотр рекламы!');
            startGame();
        }
        
        function removeAds() {
            if (confirm('Убрать рекламу за 99₽?')) {
                adStats.isAdFree = true;
                localStorage.setItem('isAdFree', 'true');
                document.getElementById('adBanner').classList.add('hidden');
                alert('✅ Premium активирована!');
            }
        }
        
        function saveAdStats() {
            localStorage.setItem('adImpressions', adStats.impressions);
            localStorage.setItem('adClicks', adStats.clicks);
            localStorage.setItem('adRevenue', adStats.revenue);
        }
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        window.addEventListener('load', () => {
            if (adStats.isAdFree) {
                document.getElementById('adBanner').classList.add('hidden');
            }
            
            if (!adStats.isAdFree) {
                setTimeout(showBannerAd, 1000);
            }
            
            startGame();
        });
        
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Telegram init
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }
    </script>
</body>
</html>
